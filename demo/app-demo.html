<title>競馬場ナビ</title>
<style>
  /* Layout: a fixed 402x874 "device canvas" scaled responsively via JS transform,
     so every screen can reuse the app's real RN pixel values 1:1. Single dark
     theme by choice — the real app has no light mode, so this mirrors it exactly. */
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --card-border:rgba(255,255,255,0.08);
    --text-primary:#F5F5F7;
    --text-secondary:#9A9A9E;
    --text-tertiary:#6E6E73;
    --accent-blue:#2997FF;
    --accent-cyan:#00FFF6;
    --accent-lime:#A6FF00;
    --accent-blue-soft:rgba(41,151,255,0.16);
    --pill-ghost:rgba(255,255,255,0.1);
    --badge-gray:#6E6E73;
    --tabbar-bg:rgba(28,28,30,0.78);
    --tabbar-border:rgba(255,255,255,0.08);
    --capture-box:#2B2B2E;
    --record-red:#FA1150;
    --record-red-soft:rgba(250,17,80,0.16);
    --circle-button:rgba(255,255,255,0.12);
    --shutter-ring:rgba(255,255,255,0.9);
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Noto Sans JP','Hiragino Sans',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:20px 40px;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
  input{font:inherit;color:inherit;}

  .page-head{max-width:402px;margin:0 auto 18px;text-align:center;}
  .page-head .eyebrow{
    font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-tertiary);
  }
  .page-head h1{font-size:22px;font-weight:900;margin:6px 0 4px;}
  .page-head p{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin:0;}

  /* ---------- device frame ---------- */
  .stage{display:flex;justify-content:center;}
  .phone-outer{
    position:relative;
    width:100%;
    max-width:402px;
    margin:0 auto;
    overflow:hidden;
    border-radius:48px;
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 30px 70px rgba(0,0,0,0.55);
    background:#000;
  }
  .phone{
    position:absolute;
    top:0;left:0;
    width:402px;height:874px;
    transform-origin:top left;
    background:#000;
  }
  .screen{
    position:absolute;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .screen-pad{padding:20px 24px 130px;}
  .screen-pad-tight{padding:12px 24px 130px;}
  .screen-pad-body{padding:0 24px 130px;flex:1;display:flex;flex-direction:column;}

  /* ---------- tab bar ---------- */
  .tabbar-wrap{position:absolute;left:28px;right:28px;bottom:24px;z-index:20;}
  .tabbar{
    display:flex;height:64px;border-radius:30px;
    background:var(--tabbar-bg);border:1px solid var(--tabbar-border);
    backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .tab .icon{font-size:17px;line-height:1;color:var(--text-tertiary);}
  .tab .label{font-size:9.5px;font-weight:600;color:var(--text-tertiary);}
  .tab.active .icon,.tab.active .label{color:var(--text-primary);}
  .tab.disabled{opacity:0.4;}

  .toast{
    position:absolute;left:32px;right:32px;bottom:104px;z-index:30;
    background:var(--card);border:1px solid var(--card-border);border-radius:30px;
    padding:12px 16px;text-align:center;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity 0.2s ease;
  }
  .toast.show{opacity:1;}

  /* ---------- typography ---------- */
  .t-largeTitle{font-size:30px;font-weight:800;letter-spacing:-0.4px;line-height:36px;}
  .t-statValue{font-size:18px;font-weight:700;line-height:21.5px;}
  .t-sectionTitle{font-size:16.5px;font-weight:700;line-height:20px;}
  .t-cardLabel{font-size:13px;font-weight:600;line-height:15.5px;}
  .t-link{font-size:12px;font-weight:400;line-height:14.3px;}
  .t-horseName{font-size:12px;font-weight:600;line-height:14.3px;}
  .t-statLabel{font-size:10px;font-weight:400;line-height:12px;}
  .t-buttonLabel{font-size:14px;font-weight:600;line-height:16.7px;}
  .t-cardTitle{font-size:13.5px;font-weight:700;line-height:16.1px;}
  .t-cardSubtitle{font-size:11px;font-weight:400;line-height:13.1px;}
  .t-cardIcon{font-size:22px;line-height:26.25px;}
  .t-navTitle{font-size:17px;font-weight:600;line-height:20.3px;}
  .t-stepHeading{font-size:16px;font-weight:600;line-height:19.1px;}
  .t-stepSubtitle{font-size:12.5px;font-weight:400;line-height:14.9px;}
  .t-pillLabel{font-size:11px;font-weight:600;line-height:13.1px;}

  /* ---------- shared header (ScreenHeader) ---------- */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;}
  .hdr .circle-btn{width:40px;height:40px;border-radius:20px;background:var(--circle-button);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none;}
  .hdr .hdr-spacer{width:40px;height:40px;flex:none;}
  .hdr .hdr-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- seat-flow header (SeatScreenHeader) ---------- */
  .seat-hdr{display:flex;align-items:center;gap:12px;padding:16px 24px 0;}
  .seat-hdr .back-btn{width:40px;height:52px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none;}
  .seat-hdr .seat-hdr-title{flex:1;font-size:24px;font-weight:700;}

  /* ---------- summary ---------- */
  .track-card-wrap{position:relative;margin-bottom:20px;}
  .track-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:16px;}
  .track-icon{width:34px;height:34px;border-radius:17px;background:var(--record-red-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;}
  .track-card-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .track-card-title{color:var(--text-primary);}
  .track-card-sub{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chevron{color:var(--text-tertiary);font-size:20px;font-weight:700;}

  .header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0 20px;}
  .track-pill{display:flex;align-items:center;gap:8px;height:32px;max-width:170px;padding:0 16px;border-radius:16px;background:var(--pill-ghost);}
  .track-pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .navi-wrap{margin-bottom:20px;}
  .navi-label{color:var(--text-secondary);margin-bottom:8px;display:block;}
  .navi-island{display:flex;background:#000;border-radius:999px;padding:4px;gap:4px;}
  .navi-opt{flex:1;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);}
  .navi-opt.active-race{background:var(--accent-lime);color:#000;}
  .navi-opt.active-facility{background:var(--accent-blue);color:#000;}

  .overview-card{background:var(--card);border:1px solid var(--card-border);border-radius:24px;padding:24px;margin-bottom:32px;}
  .overview-card .lbl{color:var(--text-secondary);margin-bottom:12px;display:block;}
  .overview-card .val{color:var(--text-primary);margin-bottom:20px;display:block;}
  .overview-card .lnk{color:var(--accent-blue);}

  .section-title{color:var(--text-primary);margin-bottom:16px;display:block;}
  .section-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

  .stats-card{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:20px 24px;margin-bottom:32px;}
  .stat{display:flex;flex-direction:column;gap:8px;}
  .stat .lbl{color:var(--text-secondary);}
  .stat .val{font-variant-numeric:tabular-nums;}

  .horse-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:32px;}
  .horse-card{width:104px;height:96px;background:var(--card);border:1px solid var(--card-border);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:6px;text-align:center;}
  .horse-emoji{font-size:30px;}

  .menu-list{display:flex;flex-direction:column;gap:12px;}
  .menu-row{display:flex;align-items:center;justify-content:space-between;height:65px;padding:0 20px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;}

  /* ---------- RaceHeroCard ---------- */
  .hero-card{background:var(--card);border:1px solid var(--card-border);border-radius:24px;padding:24px;margin-bottom:32px;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .hero-entry{flex:1;display:flex;flex-direction:column;gap:8px;padding-right:16px;min-width:0;}
  .hero-entry .lbl{color:var(--text-secondary);}
  .hero-horse-row{display:flex;align-items:center;gap:8px;}
  .hero-horse-row .odds{color:var(--text-tertiary);}
  .countdown-box{align-self:flex-start;border:1.5px dashed var(--record-red-soft);border-radius:18px;padding:8px 16px;margin-top:4px;display:flex;flex-direction:column;gap:2px;}
  .countdown-box .lbl{color:var(--text-secondary);}
  .countdown-box .val{color:var(--accent-lime);}
  .next-race{color:var(--text-secondary);}
  .ring-wrap{width:80px;height:80px;flex:none;}
  .legend-row{display:flex;gap:20px;margin-top:20px;}
  .legend-item{display:flex;align-items:center;gap:4px;}
  .legend-dot{width:7px;height:7px;border-radius:4px;}
  .legend-item span{color:var(--text-secondary);}
  .hero-btn-row{display:flex;gap:16px;margin-top:20px;}
  .btn-flex{flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;}
  .btn-primary{background:var(--accent-blue);color:var(--text-primary);}
  .btn-ghost{background:var(--pill-ghost);color:var(--text-primary);}

  /* ---------- venue services ---------- */
  .vs-banner{position:relative;height:140px;border-radius:24px;margin-bottom:24px;overflow:hidden;background:var(--accent-blue-soft);display:flex;align-items:flex-end;}
  .vs-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .vs-banner-overlay{position:relative;background:rgba(11,15,12,0.55);padding:12px 20px;width:100%;}
  .vs-btn-row{display:flex;gap:24px;margin-bottom:32px;}
  .vs-btn{flex:1;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);}
  .vs-grid{display:flex;flex-wrap:wrap;justify-content:space-between;row-gap:14px;}
  .service-card{width:163px;height:112px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;display:flex;flex-direction:column;justify-content:center;padding-left:20px;gap:8px;}
  .service-card[data-disabled="1"]{cursor:default;}
  .service-title{color:var(--text-primary);}
  .service-sub{color:var(--text-secondary);}

  /* ---------- track select ---------- */
  .banner-lg{height:168px;border-radius:24px;margin-bottom:32px;overflow:hidden;position:relative;display:flex;align-items:flex-end;}
  .banner-lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .banner-scrim{position:relative;background:rgba(0,0,0,0.45);padding:24px;width:100%;}
  .badge-lime{align-self:flex-start;height:22px;padding:0 12px;border-radius:11px;background:var(--accent-lime);color:#000;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .featured-title{color:var(--text-primary);margin-bottom:8px;display:block;}
  .featured-venue{color:var(--text-primary);}
  .claim-badge{position:absolute;top:16px;right:16px;height:22px;padding:0 12px;border-radius:11px;background:var(--accent-lime);color:#000;display:flex;align-items:center;justify-content:center;}
  .list-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .search-btn{width:32px;height:32px;border-radius:16px;background:var(--pill-ghost);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .search-input{width:100%;height:44px;border-radius:18px;background:var(--card);border:1px solid var(--card-border);padding:0 16px;color:var(--text-primary);margin-bottom:16px;}
  .track-row{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--card);border:1px solid var(--card-border);border-radius:18px;margin-bottom:12px;}

  /* ---------- AI capture-mode / hub ---------- */
  .option-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:20px;margin-bottom:16px;}
  .option-card.recommended{border-color:var(--accent-blue);}
  .option-icon{width:48px;height:48px;border-radius:24px;background:var(--circle-button);display:flex;align-items:center;justify-content:center;color:var(--accent-blue);font-size:18px;flex:none;}
  .option-text{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .option-label-row{display:flex;align-items:center;gap:8px;}
  .badge-blue{background:var(--accent-blue);color:var(--text-primary);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;}
  .option-desc{color:var(--text-secondary);}

  .slot-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:20px;margin-bottom:16px;}
  .slot-card.done{border-color:var(--accent-lime);}
  .slot-icon{width:44px;height:44px;border-radius:22px;background:var(--capture-box);display:flex;align-items:center;justify-content:center;color:var(--accent-blue);font-size:16px;flex:none;}
  .slot-icon.done{background:var(--circle-button);}
  .slot-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .slot-status{color:var(--text-tertiary);}
  .slot-status.done{color:var(--accent-lime);}
  .analyze-btn{height:50px;border-radius:25px;background:var(--accent-blue);color:var(--text-primary);display:flex;align-items:center;justify-content:center;margin-top:auto;margin-bottom:24px;}
  .analyze-btn.disabled{opacity:0.4;pointer-events:none;}

  /* ---------- capture screens ---------- */
  .capture-box{width:300px;height:300px;border-radius:24px;background:var(--capture-box);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;padding-top:16px;margin:0 auto;position:relative;}
  .capture-badge{height:24px;padding:0 16px;border-radius:12px;background:var(--accent-lime);color:#000;display:flex;align-items:center;justify-content:center;}
  .record-badge{height:26px;padding:0 16px;border-radius:13px;background:var(--record-red);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
  .capture-heading{color:var(--text-primary);margin-top:20px;text-align:center;display:block;}
  .capture-subtitle{color:var(--text-secondary);margin-top:8px;text-align:center;max-width:320px;margin-inline:auto;display:block;}
  .shutter-outer{width:68px;height:68px;border-radius:34px;border:4px solid var(--shutter-ring);display:flex;align-items:center;justify-content:center;margin:32px auto 0;}
  .shutter-inner{width:54px;height:54px;border-radius:27px;background:var(--text-primary);}
  .shutter-inner.video{background:var(--record-red);}
  .shutter-inner.video.recording{width:26px;height:26px;border-radius:6px;}
  .actions-row{display:flex;gap:20px;margin:32px auto 0;justify-content:center;}
  .action-btn{width:145px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;}

  .guide-svg{opacity:0.28;}

  /* ---------- analysis result ---------- */
  .assist-notice{display:flex;gap:8px;background:var(--accent-blue-soft);border-radius:18px;padding:16px;margin-bottom:16px;}
  .assist-notice .i{color:var(--accent-blue);font-size:14px;}
  .assist-notice p{flex:1;color:var(--text-primary);line-height:18px;margin:0;}
  .source-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .source-chip{display:flex;align-items:center;gap:4px;background:var(--pill-ghost);border-radius:999px;padding:6px 12px;}
  .source-chip .k{color:var(--text-tertiary);}
  .source-chip .v{color:var(--text-primary);}
  .conf-high{color:var(--accent-lime);}
  .conf-mid{color:var(--accent-cyan);}
  .verdict{background:var(--card);border:1px solid var(--accent-blue);border-radius:24px;padding:24px;margin-bottom:32px;}
  .verdict-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .verdict-score-wrap{display:flex;align-items:flex-end;}
  .verdict-score{color:var(--accent-blue);font-size:40px;font-weight:700;}
  .verdict-suffix{color:var(--text-tertiary);font-size:13px;margin-left:2px;margin-bottom:6px;}
  .verdict-mark-row{display:flex;align-items:center;gap:8px;}
  .mark-glyph{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--accent-lime);display:flex;align-items:center;justify-content:center;color:var(--accent-lime);font-size:11px;}
  .verdict-mark-text{color:var(--accent-lime);}
  .overall-label{color:var(--text-secondary);margin-bottom:8px;display:block;}
  .overall-text{color:var(--text-primary);line-height:21px;display:block;}
  .breakdown{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
  .metric-row{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:16px;}
  .metric-row.estimated{border-style:dashed;border-color:var(--text-tertiary);}
  .metric-header{display:flex;justify-content:space-between;align-items:center;}
  .metric-label-row{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
  .metric-label{color:var(--text-primary);}
  .estimated-tag{border:1px solid var(--text-tertiary);border-radius:999px;padding:1px 8px;color:var(--text-tertiary);font-size:10px;font-weight:600;}
  .metric-score{font-size:16px;font-weight:700;}
  .metric-comment{color:var(--text-secondary);margin-top:4px;display:block;}
  .metric-bar-track{height:5px;border-radius:3px;background:var(--pill-ghost);overflow:hidden;margin-top:12px;}
  .metric-bar-fill{height:100%;border-radius:3px;}
  .gait-note{color:var(--text-tertiary);margin-bottom:12px;display:block;}
  .disclaimer{color:var(--text-tertiary);margin-bottom:24px;display:block;}
  .retry-btn{height:50px;border-radius:25px;background:var(--pill-ghost);color:var(--text-primary);display:flex;align-items:center;justify-content:center;}

  /* ---------- more / language ---------- */
  .lang-toggle{display:flex;background:var(--badge-gray);border-radius:12px;padding:2px;}
  .lang-opt{height:22px;padding:0 12px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);}
  .lang-opt.active{background:var(--text-primary);color:#000;}

  /* ---------- seat flow ---------- */
  .seat-card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
  .seat-card-title-lg{color:var(--text-primary);font-size:21px;font-weight:700;}
  .seat-card-title-md{color:var(--text-primary);font-size:20px;font-weight:700;}
  .seat-card-hint{color:var(--text-secondary);margin-bottom:8px;}
  .seat-primary-btn{height:52px;border-radius:16px;background:var(--accent-blue);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .seat-primary-btn.on-black{color:#000;}
  .seat-scan-btn{height:52px;border-radius:16px;background:var(--accent-blue);color:#000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-top:10px;}
  .seat-manual-hint{color:var(--text-secondary);font-size:12px;margin-bottom:16px;}
  .seat-field{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .seat-field .k{color:var(--text-secondary);font-size:11px;}
  .seat-field .v{color:var(--text-primary);font-size:15px;}
  .seat-chip-row{display:flex;gap:12px;margin-bottom:24px;}
  .seat-chip{flex:1;background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:4px;}
  .seat-chip .k{color:var(--text-secondary);font-size:11px;}
  .seat-chip .v{color:var(--text-primary);font-weight:700;}
  .seat-chip .v.sz16{font-size:16px;}
  .seat-chip .v.sz22{font-size:22px;}
  .seat-footnote{color:var(--text-secondary);font-size:11px;margin-top:12px;}
  .seat-floor-tag{color:var(--text-secondary);font-size:12px;margin-bottom:12px;display:block;}
  .seat-redo-pill{align-self:center;padding:10px 20px;border-radius:24px;border:1px solid var(--badge-gray);color:var(--text-secondary);font-size:11px;}

  .seat-subtitle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px;}

  function screenAiResult(){
    var tt=t(), locale=state.locale, src=state.ai.resultSource;
    var metrics=METRICS[locale], review=OVERALL_REVIEW[locale];
    var overall=Math.round(metrics.reduce(function(a,m){return a+m.score;},0)/metrics.length);
    var hasMotion = src.type==='video';
    var sourceText = hasMotion ? tt.aiScan.sourceVideo :
      tt.aiScan.sourcePhoto+'（'+src.angles.map(function(a){return a==='front'?tt.aiScan.frontTitle:tt.aiScan.sideTitle;}).join('・')+'）';

    var html=header(tt.aiScan.resultTitle,'ai-retry');
    html += '<div class="screen-pad">';
    html += '<div class="assist-notice"><span class="i">ⓘ</span><p class="t-stepSubtitle">'+tt.aiScan.assistNotice+'</p></div>';

    html += '<div class="source-row">'+
      '<span class="source-chip"><span class="t-pillLabel k">'+tt.aiScan.sourceLabel+'</span><span class="t-pillLabel v">'+sourceText+'</span></span>'+
      '<span class="t-statLabel '+(hasMotion?'conf-high':'conf-mid')+'">'+(hasMotion?tt.aiScan.confidenceHigh:tt.aiScan.confidenceMedium)+'</span>'+
    '</div>';

    html += '<div class="verdict"><div class="verdict-top">'+
      '<div class="verdict-score-wrap"><span class="verdict-score">'+overall+'</span><span class="verdict-suffix">/100</span></div>'+
      '<div class="verdict-mark-row"><span class="mark-glyph">◎</span><span class="t-pillLabel verdict-mark-text">'+tt.aiScan.verdictMark+'</span></div>'+
    '</div>'+
    '<span class="t-cardLabel overall-label">'+tt.aiScan.overallReviewLabel+'</span>'+
    '<span class="t-stepSubtitle overall-text">'+review+'</span></div>';

    html += '<span class="t-sectionTitle section-title">'+tt.aiScan.breakdownLabel+'</span>';
    html += '<div class="breakdown">';
    metrics.forEach(function(m){
      var estimated = m.requiresMotion && !hasMotion;
      var color = m.tier==='grass' ? 'var(--accent-lime)' : 'var(--accent-cyan)';
      html += '<div class="metric-row'+(estimated?' estimated':'')+'">'+
        '<div class="metric-header"><span class="metric-label-row"><span class="t-cardTitle metric-label">'+m.label+'</span>'+
          (estimated?'<span class="estimated-tag">'+tt.aiScan.estimatedTag+'</span>':'')+'</span>'+
          '<span class="metric-score" style="color:'+color+'">'+m.score+'</span></div>'+
        '<span class="t-cardSubtitle metric-comment">'+m.comment+'</span>'+
        '<div class="metric-bar-track"><div class="metric-bar-fill" style="width:'+m.score+'%;background:'+color+';opacity:'+(estimated?0.5:1)+'"></div></div>'+
      '</div>';
    });
    html += '</div>';

    if(!hasMotion){ html += '<span class="t-statLabel gait-note">'+tt.aiScan.gaitEstimatedNote+'</span>'; }
    html += '<span class="t-statLabel disclaimer">'+tt.aiScan.disclaimer+'</span>';
    html += '<button class="retry-btn t-buttonLabel" data-act="ai-retry" style="width:100%">'+tt.aiScan.retryButton+'</button>';
    html += '</div>';
    return html;
  }

    html += '<button class="seat-primary-btn on-black" data-act="seat-confirm-guide" style="width:100%;margin-bottom:16px">'+tt.seatGuide.guideButton+'</button>';
    html += '<button class="seat-redo-pill" data-act="seat-confirm-redo" style="display:block;margin:0 auto">'+tt.seatGuide.redoButton+'</button>';
    html += '</div>';
    return html;
  }

  function tierGrid(rows, cols, rectW, rectH, gapCol, gapRow, colors){
    var out='<div class="tier-grid" style="gap:'+gapRow+'px">';
    for(var r=0;r<rows;r++){
      out += '<div class="tier-grid-row" style="gap:'+gapCol+'px">';
      for(var c=0;c<cols;c++){
        out += '<div style="width:'+rectW+'px;height:'+rectH+'px;border-radius:2px;background:'+colors[r]+'"></div>';
      }
      out += '</div>';
    }
    return out+'</div>';
  }

  function screenSeatDirection(){
    var tt=t();
    var venueLabel=tt.seatGuide.venueLabel;
    var parts=venueLabel.split('・');
    var venueBold=parts[0], venueRest= parts.length>1 ? '・'+parts.slice(1).join('・') : '';

    var S=['#4a4a52','#42424a','#3a3a42','#303038'];
    var A=['#3c3c44','#363640','#30303a','#2c2c36','#282832'];
    var B=['#30303a','#2c2c36','#282832','#242430','#20202c','#1c1c28'];
    var Cc=['#2c2c36','#2c2c36','#2c2c36','#252530'];

    var html=seatHeader(tt.seatGuide.directionTitle,'seat-direction-back');
    html += '<div class="screen-pad-tight">';

    html += '<div class="seat-subtitle-row">'+
      '<span class="seat-subtitle"><b>'+venueBold+'</b>'+venueRest+'</span>'+
      '<div class="seat-label-chip">'+
        '<span class="tier">'+DEMO_SEAT.tier+tt.seatGuide.tierLabel+'</span>'+
        '<span class="meta">'+DEMO_SEAT.row+tt.seatGuide.rowLabel+'</span>'+
        '<span class="meta">'+DEMO_SEAT.number+tt.seatGuide.seatNumberLabel+'</span>'+
      '</div></div>';

    html += '<div class="map-outer"><div class="map-canvas">';

    html += '<div style="position:absolute;left:4.37%;top:30.20%;width:90.16%;height:40.82%">'+
      '<svg width="100%" height="100%" viewBox="0 0 330 200">'+
        '<ellipse cx="165" cy="100" rx="165" ry="100" fill="#1A2E1A" opacity="0.6"/>'+
        '<ellipse cx="165" cy="100" rx="139" ry="76" fill="black" opacity="0.85"/>'+
      '</svg></div>';

    html += '<div class="tier-bg" style="left:21.86%;top:2.04%;width:56.28%;height:14.29%;background:#333338;border-radius:14px">'+tierGrid(4,11,14,7,3,5,S)+'</div>';
    html += '<span class="s-tier-label" style="left:48.91%;top:1.63%">S席</span>';
    html += '<div class="tier-bg" style="left:0.27%;top:3.67%;width:18.58%;height:18.37%;background:#2a2a2e;border-radius:12px;padding-left:6px;padding-right:6px">'+tierGrid(5,4,12,7,3,5,A)+'</div>';
    html += '<div class="tier-bg" style="left:80.33%;top:3.67%;width:18.58%;height:18.37%;background:#2a2a2e;border-radius:12px;padding-left:6px;padding-right:6px">'+tierGrid(5,4,12,7,3,5,A)+'</div>';
    html += '<div class="tier-bg" style="left:0.27%;top:23.06%;width:15.03%;height:15.31%;background:#1e1e22;border-radius:12px;padding-left:6px;padding-right:6px">'+tierGrid(6,3,12,7,3,5,B)+'</div>';
    html += '<div class="tier-bg" style="left:83.88%;top:23.06%;width:15.03%;height:15.31%;background:#1e1e22;border-radius:12px;padding-left:6px;padding-right:6px">'+tierGrid(6,3,12,7,3,5,B)+'</div>';

    var cGroups='<div style="display:flex;gap:5px">';
    for(var g=0; g<4; g++){ cGroups += tierGrid(4,5,12,7,3,5,Cc); }
    cGroups += '</div>';
    html += '<div class="tier-bg" style="left:6.97%;top:74.29%;width:86.07%;height:11.84%;background:#1e1e22;border-radius:12px">'+cGroups+'</div>';

    html += '<div class="gate-wrap" style="left:-1.37%;top:39.39%">'+
      '<div class="gate-icon-row"><span class="gate-bar"></span><span class="gate-box"></span><span class="gate-bar"></span></div>'+
      '<span class="gate-label">'+tt.seatGuide.westGate+'</span></div>';
    html += '<div class="gate-wrap" style="left:88.80%;top:62.86%">'+
      '<div class="gate-icon-row"><span class="gate-bar"></span><span class="gate-box"></span><span class="gate-bar"></span></div>'+
      '<span class="gate-label">'+tt.seatGuide.eastGate+'</span></div>';

    html += '<div class="amenity-pill" style="left:21.86%;top:16.94%"><span class="amenity-icon"></span><span class="amenity-label">'+tt.seatGuide.shopLabel+'</span></div>';
    html += '<div class="amenity-pill" style="left:63.93%;top:16.94%"><span class="amenity-icon"></span><span class="amenity-label">'+tt.seatGuide.shopLabel+'</span></div>';
    html += '<div class="amenity-pill" style="left:20.77%;top:23.47%"><span class="amenity-icon"></span><span class="amenity-label">'+tt.seatGuide.infoLabel+'</span></div>';
    html += '<div class="amenity-pill" style="left:-0.27%;top:64.49%"><span class="amenity-icon">🚻</span><span class="amenity-label">'+tt.seatGuide.restroomLabel+'</span></div>';

    html += '<div class="compass" style="left:90.16%;top:85.71%"><span class="n">N</span>'+
      '<svg width="8" height="12" viewBox="0 0 8 12"><path d="M6.3336 6L4 2.4996L1.6664 6M4 2.4996V9.5004" stroke="#6B6B70" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>';

    html += '<div class="glow-dot" style="position:absolute;left:57.92%;top:2.04%;width:19.13%;height:14.29%">'+
      '<svg width="100%" height="100%" viewBox="0 0 70 70">'+
        '<defs>'+
          '<radialGradient id="haloLarge" cx="35" cy="35" r="35" gradientUnits="userSpaceOnUse">'+
            '<stop offset="0" stop-color="#2997FF" stop-opacity="0.4"/><stop offset="1" stop-color="#2997FF" stop-opacity="0"/></radialGradient>'+
          '<radialGradient id="haloMed" cx="35" cy="35" r="20" gradientUnits="userSpaceOnUse">'+
            '<stop offset="0" stop-color="#2997FF" stop-opacity="0.5"/><stop offset="1" stop-color="#2997FF" stop-opacity="0"/></radialGradient>'+
        '</defs>'+
        '<circle cx="35" cy="35" r="35" fill="url(#haloLarge)"/>'+
        '<circle cx="35" cy="35" r="20" fill="url(#haloMed)"/>'+
        '<circle cx="35" cy="35" r="5" fill="#2997FF"/>'+
      '</svg></div>';

    html += '<div class="seat-pin-wrap" style="left:24.04%;top:55.51%;width:9.55%;height:6.23%">'+
      '<div style="transform:rotate(-27.75deg)">'+
        '<svg width="29.5" height="19" viewBox="0 0 29.5 18.9998">'+
          '<path d="M29.5 9.5C26.6132 14.5 15.7467 17.9998 10.2467 18.9998C5 18.9998 0 14.7467 0 9.5C0 4.2533 5 -0.000218101 9.5 8.38768e-09C15 1 26.6132 4.00659 29.5 9.5Z" fill="#2997FF"/>'+
        '</svg></div></div>';

    html += '</div></div>'; // map-canvas, map-outer

    html += '<button class="seat-done-btn" data-act="seat-direction-done" style="width:100%">'+tt.seatGuide.doneButton+'</button>';
    html += '</div>';
    return html;
  }

  /* ============ render ============ */

  function currentScreenHtml(){
    if(state.tab==='summary'){
      return state.trackSelectOpen ? screenTrackSelect() : screenSummary();
    }
    if(state.tab==='ai'){
      var step=state.ai.step;
      if(step==='select') return screenAiSelect();
      if(step==='video') return screenAiVideo();
      if(step==='photoHub') return screenAiPhotoHub();
      if(step==='photoCapture') return screenAiPhotoCapture();
      return screenAiResult();
    }
    if(state.tab==='bet') return screenBet();
    if(state.tab==='more'){
      if(!state.more.guideOpen) return screenMore();
      var ss=state.more.seatStep;
      if(ss==='guide') return screenSeatGuide();
      if(ss==='register') return screenSeatRegister();
      if(ss==='confirm') return screenSeatConfirm();
      return screenSeatDirection();
    }
    return '';
  }

  function renderTabbar(){
    var tt=t();
    var tabs=[['summary','▤'],['ai','◎'],['bet','￥'],['more','⋯']];
    var gated = !state.trackSelected;
    var html='';
    tabs.forEach(function(pair){
      var key=pair[0], icon=pair[1];
      var disabled = gated && (key==='ai' || key==='bet');
      var active = state.tab===key;
      html += '<button class="tab'+(active?' active':'')+(disabled?' disabled':'')+'" data-act="'+(disabled?'disabled-tab':'set-tab')+'" data-tab="'+key+'">'+
        '<span class="icon">'+icon+'</span><span class="label">'+tt.tabs[key]+'</span></button>';
    });
    document.getElementById('tabbar').innerHTML = html;
  }

  function render(){
    document.getElementById('screen').innerHTML = currentScreenHtml();
    renderTabbar();
    var qi=document.getElementById('trackQueryInput');
    if(qi){
      qi.addEventListener('input', function(e){ state.trackQuery = e.target.value; render(); qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); });
    }
  }

  function showToast(msg){
    var el=document.getElementById('toast');
    el.textContent=msg;
    el.classList.add('show');
    if(state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ============ video timer ============ */
  function startVideoTimer(){
    stopVideoTimer();
    state.ai.videoTimer = setInterval(function(){
      state.ai.videoElapsed += 1;
      if(state.ai.videoElapsed >= 10){
        stopVideoTimer();
        state.ai.videoRecording = false;
        state.ai.videoCaptured = true;
      }
      render();
    }, 1000);
  }
  function stopVideoTimer(){
    if(state.ai.videoTimer){ clearInterval(state.ai.videoTimer); state.ai.videoTimer=null; }
  }

  /* ============ actions ============ */

  function onAction(act, el){
    var a=state.ai;
    if(act==='open-track-select'){ state.trackSelectOpen=true; }
    else if(act==='close-track-select'){ state.trackSelectOpen=false; state.trackSearchOpen=false; state.trackQuery=''; }
    else if(act==='toggle-track-search'){ state.trackSearchOpen=!state.trackSearchOpen; }
    else if(act==='select-track'){ state.trackSelected=el.getAttribute('data-name'); state.navi='race'; state.trackSelectOpen=false; state.trackSearchOpen=false; state.trackQuery=''; }
    else if(act==='set-navi'){ state.navi=el.getAttribute('data-mode'); }
    else if(act==='set-tab'){ state.tab=el.getAttribute('data-tab'); state.trackSelectOpen=false; }
    else if(act==='disabled-tab'){ state.tab='summary'; state.trackSelectOpen=false; showToast(t().summary.selectTrackToast); }
    else if(act==='set-locale'){ state.locale=el.getAttribute('data-locale'); }

    else if(act==='ai-select-video'){ a.step='video'; a.videoRecording=false; a.videoElapsed=0; a.videoCaptured=false; stopVideoTimer(); }
    else if(act==='ai-select-photo'){ a.step='photoHub'; }
    else if(act==='ai-video-back'){ a.step='select'; stopVideoTimer(); }
    else if(act==='ai-video-shutter'){
      if(!a.videoCaptured){
        a.videoRecording=!a.videoRecording;
        if(a.videoRecording){ startVideoTimer(); } else { stopVideoTimer(); }
      }
    }
    else if(act==='ai-video-retake'){ a.videoRecording=false; a.videoElapsed=0; a.videoCaptured=false; stopVideoTimer(); }
    else if(act==='ai-video-complete'){ a.resultSource={type:'video'}; a.step='done'; stopVideoTimer(); }
    else if(act==='ai-hub-back'){ a.step='select'; }
    else if(act==='ai-hub-capture'){ a.activeAngle=el.getAttribute('data-angle'); a.photoCaptured=false; a.step='photoCapture'; }
    else if(act==='ai-hub-analyze'){
      if(a.captured.front || a.captured.side){
        var angles=['front','side'].filter(function(x){return a.captured[x];});
        a.resultSource={type:'photo',angles:angles};
        a.step='done';
      }
    }
    else if(act==='ai-capture-back'){ a.step='photoHub'; }
    else if(act==='ai-capture-shutter'){ a.photoCaptured=true; }
    else if(act==='ai-capture-retake'){ a.photoCaptured=false; }
    else if(act==='ai-capture-confirm'){ a.captured[a.activeAngle]=true; a.photoCaptured=false; a.step='photoHub'; }
    else if(act==='ai-retry'){ a.step='select'; a.captured={front:false,side:false}; a.activeAngle=null; a.photoCaptured=false; a.videoRecording=false; a.videoElapsed=0; a.videoCaptured=false; stopVideoTimer(); }

    else if(act==='more-open-guide'){ state.more.guideOpen=true; state.more.seatStep='guide'; }
    else if(act==='seat-guide-close'){ state.more.guideOpen=false; }
    else if(act==='seat-guide-find'){ state.more.seatStep='register'; }
    else if(act==='seat-guide-map'){ state.more.seatStep='direction'; }
    else if(act==='seat-register-back'){ state.more.seatStep='guide'; }
    else if(act==='seat-register-review'){ state.more.seatStep='confirm'; }
    else if(act==='seat-confirm-back'){ state.more.seatStep='register'; }
    else if(act==='seat-confirm-guide'){ state.more.seatStep='direction'; }
    else if(act==='seat-confirm-redo'){ state.more.seatStep='register'; }
    else if(act==='seat-direction-back'){ state.more.seatStep='guide'; }
    else if(act==='seat-direction-done'){ state.more.guideOpen=false; state.more.seatStep='guide'; }

    render();
  }

  document.getElementById('screen').addEventListener('click', function(e){
    var el=e.target.closest('[data-act]');
    if(!el) return;
    e.preventDefault();
    onAction(el.getAttribute('data-act'), el);
  });
  document.getElementById('tabbar').addEventListener('click', function(e){
    var el=e.target.closest('[data-act]');
    if(!el) return;
    onAction(el.getAttribute('data-act'), el);
  });

  /* ============ responsive scale ============ */
  var phoneOuter=document.getElementById('phoneOuter');
  var phone=document.getElementById('phone');
  function rescale(){
    var w=phoneOuter.getBoundingClientRect().width;
    var scale=w/402;
    phone.style.transform='scale('+scale+')';
    phoneOuter.style.height=(874*scale)+'px';
  }
  window.addEventListener('resize', rescale);
  rescale();

  render();
})();
</script>
